dialogue.comandante_ava.0=Pilot, the colony needs you. This is the operation plan.
dialogue.comandante_ava.1=The colony system has been infected. The machines turned against us.
dialogue.comandante_ava.2=Here is the plan: move through the sector and secure the primary objective. Do not rush.
dialogue.comandante_ava.3=Your weapon energy is limited. Collect cells and recharge when you can.
dialogue.comandante_ava.4=Good luck, pilot. The colony is counting on you.
dialogue.engenheira_nia.0=Your equipment needs maintenance. I can recharge your energy.
dialogue.engenheira_nia.1=Ready. Energy restored. Take care, pilot.
dialogue.pesquisador_ivo.0=I knew you would come. I have information about what is happening.
dialogue.pesquisador_ivo.1=Use what you learned here wisely. See you soon.
dialogue.armeiro_mercurio.0=Every weapon has a role in battle. Would you like to see my arsenal?
dialogue.armeiro_mercurio.1=Come back anytime. The best weapon is the one you understand.
dialogue.default.0=Hello, pilot. I am glad to see you.
dialogue.default.1=See you later, pilot.
