plugins {
    id 'com.android.application'
}

android {
    namespace 'com.traduvertgames.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.traduvertgames.android'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('syncRpgContent', Copy) {
    from(rootProject.file('../res/assets/generated/rpg_sprites'))
    include('**/*.png', '**/*.json')
    into(layout.projectDirectory.dir('src/main/assets/rpg'))
}

tasks.register('syncRpgWorldContent', Copy) {
    from(rootProject.file('../res/assets/generated/rpg_world'))
    include('**/*.png', '**/*.json')
    into(layout.projectDirectory.dir('src/main/assets/rpg/world'))
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncRpgContent'))
    dependsOn(tasks.named('syncRpgWorldContent'))
}
