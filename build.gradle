plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'com.traduvertgames.main.Game'
}

tasks.register('runContentStudio', JavaExec) {
    group = 'application'
    description = 'Abre o aplicativo desktop para gerar mapas, tiles, sprites e manifestos.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.traduvertgames.tools.ContentStudioApp'
}

tasks.register('importUserAssets', Exec) {
    group = 'assets'
    description = 'Recorta, normaliza e registra os assets colocados em res/assets/incoming/user_uploads.'
    workingDir projectDir
    commandLine 'python3', 'tools/import_user_assets.py'
}


tasks.register('generateDefaultEnemySprites', JavaExec) {
    group = 'application'
    description = 'Gera o pacote-base de sprites distintos, transparentes e tiles de Brumafolha.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.traduvertgames.tools.ContentStudioAssetBootstrap'
}

tasks.register('generateBrumafolhaTerrain', JavaExec) {
    group = 'application'
    description = 'Gera automaticamente as 10 variações 32×32 de grama, estrada e ruínas no diretório de runtime.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.traduvertgames.tools.BrumafolhaTerrainBootstrap'
}

tasks.register('generateDefaultRpgContent', JavaExec) {
    group = 'application'
    description = 'Gera o consumível e a arma RPG iniciais com manifestos e ícones 32×32.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.traduvertgames.tools.RpgContentBootstrap'
}

tasks.register('generateOutlandEnemyPack', JavaExec) {
    group = 'application'
    description = 'Gera os novos inimigos configuráveis da Charneca da Bruma, com sprites e manifestos 32×32.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.traduvertgames.tools.OutlandEnemyBootstrap'
}

tasks.register('generateMistSovereignBoss', JavaExec) {
    group = 'application'
    description = 'Demonstra a criação e exportação do chefe Soberano da Bruma no Content Studio.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.traduvertgames.tools.MistSovereignBossBootstrap'
}

tasks.register('generateMistSovereignAbility', JavaExec) {
    group = 'application'
    description = 'Exporta a habilidade Núcleo da Bruma configurada para o Soberano da Bruma.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.traduvertgames.tools.MistSovereignAbilityBootstrap'
}

sourceSets {
    main.java.srcDirs = ['src','res']
    main.resources.srcDirs = ['src','res']
    test.java.srcDirs = ['tests/java']
    test.resources.srcDirs = ['tests/resources']
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Os testes de jogo são headless: criam o `Game` sem janela.
    jvmArgs '-Djava.awt.headless=false',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

check.dependsOn test
